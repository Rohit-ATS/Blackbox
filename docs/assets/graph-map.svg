<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" role="img" aria-label="The BLACKBOX graph: nodes, relationships, and how the agent queries them">
  <title>The BLACKBOX graph map: 13 node labels, 24 relationship types, the three edges the agent writes, the AgentStep trace chain, and the three FalkorDB algorithms the agent traverses with</title>
  <defs>
    <linearGradient id="gp" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#272226"/>
      <stop offset="100%" stop-color="#171515"/>
    </linearGradient>
    <linearGradient id="gpa" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#2b2333"/>
      <stop offset="100%" stop-color="#1a1620"/>
    </linearGradient>
    <radialGradient id="gw" cx="50%" cy="0%" r="68%">
      <stop offset="0%" stop-color="#7b5ce0" stop-opacity=".16"/>
      <stop offset="72%" stop-color="#7b5ce0" stop-opacity="0"/>
    </radialGradient>
    <filter id="gg" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <marker id="ga" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6f6a6e"/>
    </marker>
    <marker id="gac" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#edc5fc"/>
    </marker>
  </defs>

  <rect width="1280" height="900" fill="#0c0b0c"/>
  <rect width="1280" height="900" fill="url(#gw)"/>

  <text x="64" y="56" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.6" fill="#edc5fc">THE GRAPH</text>
  <text x="64" y="94" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#fafafa">13 node labels, 24 relationship types — <tspan font-family="Georgia, Times New Roman, serif" font-style="italic" font-weight="400" fill="#edc5fc">one graph per tenant.</tspan></text>
  <text x="64" y="120" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#8a8589">Seeded <tspan fill="#c8c8c8">tenant:acme</tspan> — 42 services · 97 dependencies (194 edges with the inverse) · 320 deploys · 320 PRs · 186 files · 18 people · 11 prior incidents · 40 runbooks.</text>
  <text x="64" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#8a8589">Edges drawn in <tspan fill="#edc5fc">lilac</tspan> are the ones the agent writes at runtime. Dashed pills are the same node repeated, so each panel reads on its own.</text>

  <!-- ========================= PANEL 1: TOPOLOGY ========================= -->
  <rect x="64" y="150" width="376" height="430" rx="14" fill="url(#gp)" stroke="#ffffff1a"/>
  <text x="90" y="186" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.2" fill="#8a8589">TOPOLOGY — WHAT TALKS TO WHAT</text>

  <path d="M207 283 C 200 232, 304 232, 297 283" fill="none" stroke="#6f6a6e" stroke-width="1.4" marker-end="url(#ga)"/>
  <text x="252" y="212" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#c8c8c8">:DEPENDS_ON</text>
  <text x="252" y="228" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#9780ff">:IMPACTS</text>

  <rect x="177" y="283" width="150" height="36" rx="9" fill="#1c1b1c" stroke="#3a3639"/>
  <text x="252" y="306" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#fafafa">:Service</text>

  <line x1="178" y1="402" x2="222" y2="323" stroke="#6f6a6e" stroke-width="1.3" marker-end="url(#ga)"/>
  <text x="100" y="372" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#8a8589">:FIRED_ON</text>
  <rect x="105" y="402" width="110" height="34" rx="9" fill="#141314" stroke="#2a2729"/>
  <text x="160" y="424" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#c8c8c8">:Alert</text>

  <line x1="288" y1="321" x2="340" y2="400" stroke="#6f6a6e" stroke-width="1.3" marker-end="url(#ga)"/>
  <text x="312" y="372" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#8a8589">:OWNED_BY</text>
  <rect x="295" y="402" width="110" height="34" rx="9" fill="#141314" stroke="#2a2729"/>
  <text x="350" y="424" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#c8c8c8">:Team</text>

  <rect x="90" y="462" width="324" height="98" rx="10" fill="#101010" stroke="#262325"/>
  <text x="108" y="486" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5d5a5e">DEPENDS_ON: consumer → provider. IMPACTS: its inverse.</text>
  <text x="108" y="508" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8a8589">Criticality lives on the <tspan fill="#edc5fc">edge</tspan>, not the node:</text>
  <text x="108" y="530" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#c8c8c8">{criticality 1-5, protocol, cost: 6-criticality}</text>
  <text x="108" y="550" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5d5a5e">so shortest-path prefers the hard synchronous route.</text>

  <!-- ===================== PANEL 2: CHANGE &amp; PEOPLE ===================== -->
  <rect x="457" y="150" width="366" height="430" rx="14" fill="url(#gp)" stroke="#ffffff1a"/>
  <text x="483" y="186" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.2" fill="#8a8589">CHANGE &amp; PEOPLE — WHAT MOVED, AND WHO</text>

  <rect x="672" y="214" width="110" height="32" rx="9" fill="#141314" stroke="#2a2729"/>
  <text x="727" y="235" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#c8c8c8">:Team</text>
  <line x1="727" y1="326" x2="727" y2="250" stroke="#6f6a6e" stroke-width="1.3" marker-end="url(#ga)"/>
  <text x="735" y="294" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#8a8589">:MEMBER_OF</text>

  <rect x="480" y="214" width="120" height="34" rx="9" fill="#1c1b1c" stroke="#3a3639"/>
  <text x="540" y="236" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#fafafa">:Deploy</text>

  <line x1="540" y1="252" x2="540" y2="326" stroke="#6f6a6e" stroke-width="1.3" marker-end="url(#ga)"/>
  <text x="548" y="294" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#8a8589">:SHIPS</text>

  <rect x="465" y="330" width="150" height="34" rx="9" fill="#1c1b1c" stroke="#3a3639"/>
  <text x="540" y="352" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#fafafa">:PullRequest</text>

  <line x1="540" y1="368" x2="540" y2="430" stroke="#6f6a6e" stroke-width="1.3" marker-end="url(#ga)"/>
  <text x="548" y="404" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#8a8589">:TOUCHES</text>

  <rect x="490" y="434" width="100" height="34" rx="9" fill="#1c1b1c" stroke="#3a3639"/>
  <text x="540" y="456" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#fafafa">:File</text>

  <line x1="540" y1="472" x2="540" y2="524" stroke="#6f6a6e" stroke-width="1.3" marker-end="url(#ga)"/>
  <text x="548" y="502" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#8a8589">:BELONGS_TO</text>

  <rect x="470" y="528" width="140" height="34" rx="9" fill="#141314" stroke="#2a2729" stroke-dasharray="3 3"/>
  <text x="540" y="550" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#c8c8c8">:Service</text>

  <path d="M478 236 C 462 300, 462 480, 468 538" fill="none" stroke="#6f6a6e" stroke-width="1.3" marker-end="url(#ga)"/>
  <text x="466" y="290" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5" fill="#8a8589">:DEPLOYED_TO</text>

  <rect x="672" y="330" width="120" height="34" rx="9" fill="#1c1b1c" stroke="#3a3639"/>
  <text x="732" y="352" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#fafafa">:Person</text>
  <line x1="668" y1="347" x2="621" y2="347" stroke="#6f6a6e" stroke-width="1.3" marker-end="url(#ga)"/>
  <text x="620" y="334" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#8a8589">:AUTHORED</text>
  <line x1="700" y1="366" x2="596" y2="446" stroke="#6f6a6e" stroke-width="1.3" marker-end="url(#ga)"/>
  <text x="622" y="428" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#8a8589">:WORKED_ON</text>
  <text x="622" y="444" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5" fill="#5d5a5e">{commits, last_at}</text>

  <text x="632" y="546" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5d5a5e">a deploy is a node you can</text>
  <text x="632" y="561" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5d5a5e">reach from two hops away</text>

  <!-- ========================= PANEL 3: MEMORY ========================= -->
  <rect x="850" y="150" width="366" height="430" rx="14" fill="url(#gpa)" stroke="#ffffff26"/>
  <text x="876" y="186" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.2" fill="#edc5fc">MEMORY — AND WHAT THE AGENT WRITES</text>

  <rect x="876" y="206" width="94" height="32" rx="9" fill="#141314" stroke="#2a2729" stroke-dasharray="3 3"/>
  <text x="923" y="227" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#c8c8c8">:Alert</text>
  <rect x="1092" y="206" width="100" height="32" rx="9" fill="#141314" stroke="#2a2729" stroke-dasharray="3 3"/>
  <text x="1142" y="227" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#c8c8c8">:Deploy</text>

  <line x1="996" y1="288" x2="946" y2="243" stroke="#6f6a6e" stroke-width="1.3" marker-end="url(#ga)"/>
  <text x="872" y="266" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#8a8589">:TRIGGERED_BY</text>

  <line x1="1072" y1="288" x2="1126" y2="243" stroke="#edc5fc" stroke-width="1.6" marker-end="url(#gac)"/>
  <text x="1086" y="266" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#edc5fc">:CAUSED_BY</text>

  <rect x="965" y="292" width="130" height="36" rx="9" fill="#1c1b1c" stroke="#3a3639"/>
  <text x="1030" y="315" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#fafafa">:Incident</text>
  <text x="1030" y="344" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5d5a5e">episodic · embedding(384)</text>

  <line x1="1030" y1="350" x2="1030" y2="382" stroke="#edc5fc" stroke-width="1.6" marker-end="url(#gac)"/>
  <text x="1038" y="372" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#edc5fc">:PRODUCED</text>

  <path d="M978 326 C 950 380, 930 430, 912 455" fill="none" stroke="#edc5fc" stroke-width="1.6" marker-end="url(#gac)"/>
  <text x="864" y="404" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#edc5fc">:RESOLVED_BY</text>

  <rect x="960" y="386" width="140" height="36" rx="9" fill="#241d2b" stroke="#edc5fc66"/>
  <circle cx="1088" cy="396" r="3.5" fill="#edc5fc"/>
  <circle cx="1088" cy="396" r="8" fill="#edc5fc" opacity=".3" filter="url(#gg)">
    <animate attributeName="opacity" values=".16;.55;.16" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="1024" y="409" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13.5" fill="#edc5fc">:Postmortem</text>
  <text x="1030" y="438" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#8a8589">semantic · created_by: 'blackbox'</text>

  <rect x="858" y="458" width="104" height="32" rx="9" fill="#141314" stroke="#2a2729" stroke-dasharray="3 3"/>
  <text x="910" y="479" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#c8c8c8">:Person</text>

  <rect x="1086" y="458" width="110" height="32" rx="9" fill="#141314" stroke="#2a2729" stroke-dasharray="3 3"/>
  <text x="1141" y="479" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#c8c8c8">:Runbook</text>

  <line x1="1030" y1="446" x2="1030" y2="522" stroke="#6f6a6e" stroke-width="1.3" marker-end="url(#ga)"/>
  <text x="1036" y="476" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#8a8589">:APPLIES_TO</text>
  <line x1="1122" y1="492" x2="1080" y2="524" stroke="#6f6a6e" stroke-width="1.3" marker-end="url(#ga)"/>
  <text x="1104" y="536" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#8a8589">:COVERS</text>

  <rect x="960" y="526" width="140" height="34" rx="9" fill="#141314" stroke="#2a2729" stroke-dasharray="3 3"/>
  <text x="1030" y="548" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#c8c8c8">:Service</text>

  <text x="864" y="508" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5d5a5e">the agent's postmortems are</text>
  <text x="864" y="523" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5d5a5e">the same kind as a human's</text>

  <!-- ===================== BAND: THE TRACE IS A SUBGRAPH ===================== -->
  <rect x="64" y="604" width="1152" height="112" rx="14" fill="#141314" stroke="#2a2729"/>
  <text x="90" y="634" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.2" fill="#8a8589">HANDOFF STATE LIVES IN THE GRAPH, NOT IN PROCESS MEMORY</text>

  <rect x="90" y="650" width="156" height="36" rx="9" fill="#1c1b1c" stroke="#3a3639"/>
  <text x="168" y="673" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#fafafa">:AgentStep</text>
  <text x="168" y="702" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5d5a5e">triage</text>

  <line x1="252" y1="668" x2="356" y2="668" stroke="#6f6a6e" stroke-width="1.3" marker-end="url(#ga)"/>
  <text x="304" y="658" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#8a8589">:NEXT</text>

  <rect x="362" y="650" width="156" height="36" rx="9" fill="#1c1b1c" stroke="#3a3639"/>
  <text x="440" y="673" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#fafafa">:AgentStep</text>
  <text x="440" y="702" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5d5a5e">investigator</text>

  <line x1="524" y1="668" x2="628" y2="668" stroke="#6f6a6e" stroke-width="1.3" marker-end="url(#ga)"/>
  <text x="576" y="658" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#8a8589">:NEXT</text>

  <rect x="634" y="650" width="156" height="36" rx="9" fill="#1c1b1c" stroke="#3a3639"/>
  <text x="712" y="673" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#fafafa">:AgentStep</text>
  <text x="712" y="702" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5d5a5e">comms</text>

  <line x1="796" y1="668" x2="900" y2="668" stroke="#edc5fc" stroke-width="1.4" marker-end="url(#gac)"/>
  <text x="848" y="658" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#edc5fc">:TOUCHED</text>

  <rect x="906" y="650" width="286" height="36" rx="9" fill="#101010" stroke="#262325"/>
  <text x="1049" y="673" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#c8c8c8">any node it looked at — provenance</text>
  <text x="1049" y="702" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5d5a5e">which is why the trace panel is a Cypher query, not a log tail</text>

  <!-- ===================== BAND: HOW THE AGENT QUERIES IT ===================== -->
  <text x="64" y="762" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.6" fill="#edc5fc">HOW THE AGENT QUERIES IT</text>

  <rect x="64" y="776" width="376" height="104" rx="12" fill="url(#gp)" stroke="#ffffff1a"/>
  <text x="90" y="803" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#fafafa">affected_services</text>
  <text x="90" y="827" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#9780ff">algo.BFS(s, level, 'IMPACTS')</text>
  <text x="90" y="850" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#8a8589">blast radius, one hop level at a time —</text>
  <text x="90" y="866" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#8a8589">11 services degrade, 3 customer-facing.</text>

  <rect x="457" y="776" width="366" height="104" rx="12" fill="url(#gp)" stroke="#ffffff1a"/>
  <text x="483" y="803" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#fafafa">causal_path</text>
  <text x="483" y="827" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#9780ff">algo.SPpaths(weightProp:'cost')</text>
  <text x="483" y="850" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#8a8589">the route a failure actually travels,</text>
  <text x="483" y="866" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#8a8589">not merely an equal-hop-count one.</text>

  <rect x="850" y="776" width="366" height="104" rx="12" fill="url(#gpa)" stroke="#ffffff26"/>
  <text x="876" y="803" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#fafafa">similar_incidents</text>
  <text x="876" y="827" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#edc5fc">db.idx.vector.queryNodes — HNSW, cosine</text>
  <text x="876" y="850" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#8a8589">recall over the same index the agent</text>
  <text x="876" y="866" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#8a8589">wrote into 90 seconds earlier.</text>
</svg>
