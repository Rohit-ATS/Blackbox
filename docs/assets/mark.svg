<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="BLACKBOX mark">
  <defs>
    <filter id="mg" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="31" fill="#0c0b0c"/>
  <circle cx="32" cy="32" r="25" fill="none" stroke="#2a2729" stroke-width="1.2"/>
