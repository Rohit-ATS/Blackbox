<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-label="Memory is data, not a session">
  <title>Episodic, semantic and procedural memory as graph nodes, with the write-back loop from run 1 to run 2</title>
  <defs>
    <linearGradient id="mp" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#272226"/>
      <stop offset="100%" stop-color="#171515"/>
    </linearGradient>
    <radialGradient id="mw" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#7b5ce0" stop-opacity=".18"/>
      <stop offset="72%" stop-color="#7b5ce0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e73825"/>
      <stop offset="100%" stop-color="#edc5fc"/>
    </linearGradient>
    <filter id="g5" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="grain5">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
    </filter>
    <marker id="a5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#edc5fc"/>
    </marker>
  </defs>

  <rect width="1280" height="460" fill="#0c0b0c"/>
  <rect width="1280" height="460" fill="url(#mw)"/>

  <text x="64" y="56" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.6" fill="#edc5fc">MEMORY</text>
  <text x="64" y="94" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#fafafa">Memory is data, <tspan font-family="Georgia, Times New Roman, serif" font-style="italic" font-weight="400" fill="#edc5fc">not a session.</tspan></text>

  <!-- three memory kinds -->
  <g>
    <rect x="64" y="128" width="366" height="150" rx="14" fill="url(#mp)" stroke="#ffffff1a"/>
    <text x="90" y="162" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.2" fill="#8a8589">EPISODIC</text>
    <text x="90" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#fafafa">:Incident</text>
    <text x="90" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8a8589">What happened.</text>
    <text x="90" y="252" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5d5a5e">timestamps, symptoms, blast radius</text>

    <rect x="457" y="128" width="366" height="150" rx="14" fill="url(#mp)" stroke="#ffffff26"/>
    <circle cx="793" cy="156" r="4" fill="#edc5fc"/>
    <circle cx="793" cy="156" r="9" fill="#edc5fc" opacity=".3" filter="url(#g5)">
      <animate attributeName="opacity" values=".16;.55;.16" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="483" y="162" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.2" fill="#edc5fc">SEMANTIC</text>
    <text x="483" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#fafafa">:Postmortem</text>
    <text x="483" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8a8589">What it means — with a 384-dim embedding.</text>
    <text x="483" y="252" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5d5a5e">this is the one the agent writes</text>

    <rect x="850" y="128" width="366" height="150" rx="14" fill="url(#mp)" stroke="#ffffff1a"/>
    <text x="876" y="162" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.2" fill="#8a8589">PROCEDURAL</text>
    <text x="876" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#fafafa">:Runbook</text>
    <text x="876" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8a8589">What to do.</text>
    <text x="876" y="252" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5d5a5e">fulltext + vector hybrid retrieval</text>
  </g>

  <!-- write-back loop -->
  <g>
    <rect x="64" y="310" width="1152" height="112" rx="14" fill="#141314" stroke="#2a2729"/>

    <g transform="translate(110 366)">
      <circle cx="0" cy="0" r="7" fill="#e73825"/>
      <circle cx="0" cy="0" r="14" fill="#e73825" opacity=".22" filter="url(#g5)"/>
      <text x="0" y="-24" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6" fill="#8a8589">RUN 1</text>
      <text x="0" y="32" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5d5a5e">cold</text>
    </g>

    <line x1="132" y1="366" x2="330" y2="366" stroke="#9780ff" stroke-width="1.6" marker-end="url(#a5)"/>
    <text x="231" y="356" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#edc5fc">write_finding</text>

    <g transform="translate(372 366)">
      <rect x="-28" y="-20" width="56" height="40" rx="9" fill="#1c1b1c" stroke="#4a494b"/>
      <circle cx="0" cy="0" r="5" fill="#edc5fc"/>
      <circle cx="0" cy="0" r="11" fill="#edc5fc" opacity=".28" filter="url(#g5)">
        <animate attributeName="opacity" values=".14;.5;.14" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="-32" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#fafafa">:Postmortem</text>
      <text x="0" y="38" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#5d5a5e">created_by: blackbox</text>
    </g>

    <line x1="414" y1="366" x2="612" y2="366" stroke="#edc5fc" stroke-width="1.6" marker-end="url(#a5)"/>
    <text x="513" y="356" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#edc5fc">similar_incidents · cosine 0.59</text>

    <g transform="translate(654 366)">
      <circle cx="0" cy="0" r="7" fill="#edc5fc"/>
      <circle cx="0" cy="0" r="14" fill="#edc5fc" opacity=".22" filter="url(#g5)"/>
      <text x="0" y="-24" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6" fill="#8a8589">RUN 2</text>
      <text x="0" y="32" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5d5a5e">warm</text>
    </g>

    <line x1="730" y1="330" x2="730" y2="402" stroke="#2a2729" stroke-width="1"/>

    <text x="760" y="340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#c8c8c8">A postmortem BLACKBOX wrote is indistinguishable from one</text>
    <text x="760" y="360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#c8c8c8">a human wrote: same label, same vector index, same</text>
    <text x="760" y="380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#c8c8c8">retrieval path. Only <tspan font-family="ui-monospace, Menlo, Consolas, monospace" fill="#edc5fc">created_by</tspan> differs.</text>
    <text x="760" y="404" font-family="Georgia, Times New Roman, serif" font-style="italic" font-size="12.5" fill="#8a8589">So run 1's write is retrievable in run 2 — no special casing.</text>
  </g>

  <rect width="1280" height="460" filter="url(#grain5)" opacity=".035"/>
</svg>
