<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="BLACKBOX — the graph already knows">
  <title>BLACKBOX — the on-call agent that gets smarter every incident</title>
  <defs>
    <radialGradient id="n1" cx="72%" cy="6%" r="46%">
      <stop offset="0%" stop-color="#7b5ce0" stop-opacity=".40"/>
      <stop offset="70%" stop-color="#7b5ce0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="n2" cx="13%" cy="34%" r="40%">
      <stop offset="0%" stop-color="#edc5fc" stop-opacity=".16"/>
      <stop offset="70%" stop-color="#edc5fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="n3" cx="50%" cy="104%" r="52%">
      <stop offset="0%" stop-color="#4700d6" stop-opacity=".34"/>
      <stop offset="72%" stop-color="#4700d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="n4" cx="88%" cy="78%" r="26%">
      <stop offset="0%" stop-color="#e73825" stop-opacity=".16"/>
      <stop offset="70%" stop-color="#e73825" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#4a494b" stop-opacity=".2"/>
      <stop offset="19%" stop-color="#e73825"/>
      <stop offset="37%" stop-color="#ff1900"/>
      <stop offset="69%" stop-color="#7b5ce0"/>
      <stop offset="100%" stop-color="#4a494b" stop-opacity=".2"/>
    </linearGradient>

    <linearGradient id="serif" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#edc5fc"/>
      <stop offset="60%" stop-color="#9780ff"/>
      <stop offset="100%" stop-color="#ddb5fc"/>
    </linearGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2729" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2a2729"/>
      <stop offset="100%" stop-color="#2a2729" stop-opacity="0"/>
    </linearGradient>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="1280" height="440" fill="#0c0b0c"/>
  <rect width="1280" height="440" fill="url(#n1)"/>
  <rect width="1280" height="440" fill="url(#n2)"/>
  <rect width="1280" height="440" fill="url(#n3)"/>
  <rect width="1280" height="440" fill="url(#n4)"/>

  <!-- particle field -->
  <g fill="#ffffff">
    <circle cx="118" cy="64"  r="1.1" opacity=".45"/>
    <circle cx="232" cy="356" r="1"   opacity=".3"/>
    <circle cx="338" cy="104" r="1.3" opacity=".5"/>
    <circle cx="414" cy="298" r="1"   opacity=".28"/>
    <circle cx="556" cy="52"  r="1.2" opacity=".4"/>
    <circle cx="648" cy="392" r="1"   opacity=".3"/>
    <circle cx="744" cy="138" r="1.1" opacity=".36"/>
    <circle cx="892" cy="312" r="1.3" opacity=".44"/>
    <circle cx="968" cy="76"  r="1"   opacity=".3"/>
    <circle cx="1084" cy="252" r="1.2" opacity=".38"/>
    <circle cx="1172" cy="128" r="1"  opacity=".3"/>
    <circle cx="1216" cy="358" r="1.1" opacity=".34"/>
    <circle cx="64"  cy="222" r="1"   opacity=".26"/>
    <circle cx="786" cy="236" r="1"   opacity=".26"/>
  </g>
  <g fill="#edc5fc">
    <circle cx="186" cy="168" r="1.6" opacity=".6" filter="url(#soft)"/>
    <circle cx="862" cy="178" r="1.5" opacity=".55" filter="url(#soft)"/>
    <circle cx="1128" cy="330" r="1.6" opacity=".5" filter="url(#soft)"/>
    <circle cx="470" cy="398" r="1.4" opacity=".45" filter="url(#soft)"/>
  </g>

  <!-- faint service-graph constellation, right side -->
  <g stroke="#4a494b" stroke-opacity=".5" stroke-width="1" fill="none">
    <path d="M1010 196 L1096 152 L1186 190 M1096 152 L1104 248 M1104 248 L1010 196 M1104 248 L1192 286"/>
  </g>
  <g>
    <circle cx="1010" cy="196" r="3.4" fill="#8a8589"/>
    <circle cx="1186" cy="190" r="3.4" fill="#8a8589"/>
    <circle cx="1192" cy="286" r="3.4" fill="#8a8589"/>
    <circle cx="1096" cy="152" r="4.6" fill="#e73825"/>
    <circle cx="1096" cy="152" r="9" fill="#e73825" opacity=".25" filter="url(#glow)">
      <animate attributeName="opacity" values=".12;.42;.12" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1104" cy="248" r="4.6" fill="#edc5fc"/>
    <circle cx="1104" cy="248" r="9" fill="#edc5fc" opacity=".25" filter="url(#glow)">
      <animate attributeName="opacity" values=".4;.12;.4" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- mark: concentric rings + pip -->
  <g transform="translate(92 96)">
    <circle cx="26" cy="26" r="25" fill="none" stroke="#2a2729" stroke-width="1"/>
    <path d="M26 1 A25 25 0 0 1 51 26" fill="none" stroke="#edc5fc" stroke-width="1.4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 26 26" to="360 26 26" dur="6s" repeatCount="indefinite"/>
    </path>
    <circle cx="26" cy="26" r="16" fill="none" stroke="#2a2729" stroke-width="1"/>
    <path d="M10 26 A16 16 0 0 1 26 10" fill="none" stroke="#9780ff" stroke-width="1.4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="360 26 26" to="0 26 26" dur="8s" repeatCount="indefinite"/>
    </path>
    <circle cx="26" cy="26" r="8" fill="none" stroke="#2a2729" stroke-width="1"/>
    <circle cx="26" cy="26" r="4.2" fill="#edc5fc"/>
    <circle cx="26" cy="26" r="8" fill="#edc5fc" opacity=".3" filter="url(#glow)">
      <animate attributeName="opacity" values=".18;.55;.18" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- kicker -->
  <g transform="translate(166 108)">
    <circle cx="0" cy="8" r="2.6" fill="#edc5fc"/>
    <circle cx="0" cy="8" r="6" fill="#edc5fc" opacity=".3" filter="url(#glow)"/>
    <text x="16" y="12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2.6" fill="#edc5fc">GRAPH-NATIVE INCIDENT RESPONSE</text>
  </g>

  <!-- wordmark -->
  <text x="92" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="88" font-weight="700" letter-spacing="9" fill="#fafafa">BLACKBOX</text>

  <!-- tagline -->
  <text x="96" y="292" font-family="Georgia, Times New Roman, serif" font-style="italic" font-size="36" fill="url(#serif)">Production breaks. The graph already knows.</text>

  <!-- sub -->
  <text x="96" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" fill="#8a8589">The on-call agent that finds the change two hops upstream, pages the human who actually</text>
  <text x="96" y="354" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" fill="#8a8589">knows — then writes what it learned back into the graph.</text>

  <!-- stat strip -->
  <g transform="translate(96 390)">
    <rect x="0" y="-1" width="1" height="30" fill="#4a494b"/>
    <text x="14" y="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fafafa">11 → 7</text>
    <text x="14" y="26" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" letter-spacing="1.2" fill="#5d5a5e">TOOL CALLS</text>

    <rect x="150" y="-1" width="1" height="30" fill="#4a494b"/>
    <text x="164" y="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fafafa">61.2ms → 12.9ms</text>
    <text x="164" y="26" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" letter-spacing="1.2" fill="#5d5a5e">MEASURED GRAPH WORK</text>

    <rect x="390" y="-1" width="1" height="30" fill="#4a494b"/>
    <text x="404" y="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fafafa">9</text>
    <text x="404" y="26" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" letter-spacing="1.2" fill="#5d5a5e">TYPED GRAPH TOOLS</text>

    <rect x="560" y="-1" width="1" height="30" fill="#4a494b"/>
    <text x="574" y="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fafafa">0</text>
    <text x="574" y="26" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" letter-spacing="1.2" fill="#5d5a5e">LINES OF CYPHER FROM THE LLM</text>
  </g>

  <!-- grain + rule -->
  <rect width="1280" height="440" filter="url(#grain)" opacity=".035"/>
  <rect x="0" y="437" width="1280" height="3" fill="url(#rule)"/>
</svg>
