# Publishes the BLACKBOX console to GitHub Pages as a static site.
#
# Pages serves files, not servers: there is no FastAPI backend and no FalkorDB
# behind the published page. So this build sets NEXT_PUBLIC_REPLAY=1, which
# makes the UI replay fixtures/*.json -- real runs recorded against a real
# graph by `python -m blackbox.record_fixtures`, byte-identical to what the
# SSE endpoint streams. The page says so in a banner.
#
# For the live thing, with an agent actually querying FalkorDB: docker compose up.
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          # A project page is served from /<repo>, so every asset URL needs it.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_REPLAY: "1"
        run: npm run build:pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
