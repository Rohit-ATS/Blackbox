services:
  - type: pserv
    name: blackbox-falkordb
    runtime: image
    image:
      url: docker.io/falkordb/falkordb:latest
    plan: starter
    region: oregon
    disk:
      name: falkordb-data
      mountPath: /data
      sizeGB: 1

  - type: web
    name: blackbox-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: >-
      bash -lc "python -m blackbox.seed --all &&
      uvicorn blackbox.api:app --host 0.0.0.0 --port ${PORT:-10000}"
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: FALKOR_HOST
        fromService:
          type: pserv
          name: blackbox-falkordb
          property: host
      - key: FALKOR_PORT
        fromService:
          type: pserv
          name: blackbox-falkordb
          property: port
      - key: BLACKBOX_MODEL
        value: claude-sonnet-4-6
      - key: ANTHROPIC_API_KEY
        sync: false
