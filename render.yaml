services:
  - type: pserv
    name: blackbox-falkordb
    runtime: image
    image:
      url: docker.io/falkordb/falkordb:latest
    plan: starter
    region: oregon
    disk:
      name: falkordb-data
      mountPath: /data
      sizeGB: 1

  - type: web
    name: blackbox-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: bash start.sh
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: FALKOR_HOST
        value: blackbox-falkordb
      - key: FALKOR_PORT
        value: "6379"
      - key: BLACKBOX_MODEL
        value: claude-sonnet-4-6
      - key: ANTHROPIC_API_KEY
        sync: false
